services:
  api:
    build: .
    image: deep-space-calibration:latest
    environment:
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import os,sys,urllib.request; port=os.environ.get('API_PORT','8080'); sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/health' % port, timeout=3).status==200 else 1)\""
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  verify:
    image: deep-space-calibration:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:${API_PORT:-8080}
    entrypoint: ["sh", "scripts/verify.sh"]
    restart: "no"
