name: calibration-resolver

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: calibration-resolver:runtime
    environment:
      API_PORT: ${API_PORT:-8080}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen(
              'http://127.0.0.1:' + os.environ.get('API_PORT', '8080') + '/health',
              timeout=2,
          ).read()
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 3s

  verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    image: calibration-resolver:verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8080}
      API_BASE_URL: http://api:${API_PORT:-8080}
    command: ["python", "/app/verify/verify.py"]
    restart: "no"
